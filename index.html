<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Résultats du concours</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f8f9fb; --ink:#14171c; --muted:#6b7280; --faint:#9aa1ad;
  --line:#e4e7ec; --line-strong:#d3d8e0;
  --A:#2f6bea; --A-soft:#e9f0fe;
  --B:#e0524a; --B-soft:#fdeceb;
  --C:#c48a00; --C-soft:#fdf4dc;
  --live:#12a150; --live-soft:#e5f6ec;
  --accent:var(--A); --accent-soft:var(--A-soft);
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --surface:#171a20; --surface-2:#1d2129; --ink:#eef0f3; --muted:#9aa3b2; --faint:#6b7483;
    --line:#262b34; --line-strong:#323845;
    --A:#6d9bff; --A-soft:#1a2440;
    --B:#ff7b73; --B-soft:#3a1d1c;
    --C:#f0b92e; --C-soft:#352a10;
    --live:#34d27b; --live-soft:#123222;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}

/* Header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;padding:14px 0 10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand h1{font-size:20px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:13px;margin-top:2px}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.search{position:relative;width:260px;max-width:100%}
.search input{width:100%;height:40px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:0 12px 0 36px;font:inherit;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{padding-right:58px}
.search .go{position:absolute;right:4px;top:4px;height:32px;padding:0 12px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.badge.wait{background:#f1ebfe;color:#7c3aed}
@media (prefers-color-scheme: dark){.badge.wait{background:#2a1f45;color:#b197fc}}
.message{margin:12vh auto;max-width:640px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:40px 28px;box-shadow:var(--shadow)}
.message .ic{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:#f1ebfe;color:#7c3aed}
.message .ic svg{position:static;width:28px;height:28px;color:inherit}
.message p{margin:0;font-size:clamp(20px,3.2vw,30px);font-weight:700;letter-spacing:-.01em;line-height:1.3}
.search svg{position:absolute;left:11px;top:11px;width:18px;height:18px;color:var(--faint)}

nav.tabs{display:flex;gap:4px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.tab .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.tab:hover{background:var(--surface)}
.tab[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.tab .n{font-size:12px;font-weight:600;color:var(--faint)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;color:var(--faint);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--live);border-radius:4px}

/* Section title */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:22px 0 12px;flex-wrap:wrap}
.sec-head h2{margin:0;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.sec-head h2 .sw{width:12px;height:12px;border-radius:4px;background:var(--accent)}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:13px}

/* Stepper */
.steps{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.step{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:left;min-width:128px;box-shadow:var(--shadow)}
.step .t{font-weight:650;font-size:14px;display:flex;align-items:center;gap:8px}
.step .s{font-size:12px;color:var(--muted);margin-top:2px}
.step .st{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.step.encours .st{background:var(--live)}
.step.fini .st{background:var(--accent)}
.step[aria-selected=true]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* Filters */
.filters{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.filters button{white-space:nowrap;border:0;background:transparent;padding:6px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
.filters button[aria-pressed=true]{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.filters .c{color:var(--faint);font-weight:500;margin-left:3px}

/* Match cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:14px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.match.encours{border-color:color-mix(in srgb,var(--live) 45%,var(--line))}
.m-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.m-head b{color:var(--ink);font-weight:650;font-size:13px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.live{background:var(--live-soft);color:var(--live)}
.badge.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.done{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;background:var(--surface-2)}
.row .num{min-width:34px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);font-size:14px}
.row .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .res{font-size:12px;font-weight:700;color:var(--accent)}
button.row{border:0;width:100%;text-align:left;cursor:pointer}
button.row:hover .num{border-color:var(--accent)}
.row.win{background:var(--accent-soft)}
.row.win .num{background:var(--accent);color:#fff;border-color:var(--accent)}
.row.lose{opacity:.55}
.row.lose .name{text-decoration:line-through;text-decoration-color:var(--faint)}
.row.ph{background:transparent;border:1px dashed var(--line-strong);color:var(--faint)}
.row.ph .num{border-style:dashed;background:transparent;color:var(--faint)}
.empty{color:var(--muted);padding:28px;text-align:center;background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);margin-top:14px}

/* Bracket */
.bracket{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:18px;overflow-x:auto;padding:4px 2px 10px;margin-top:14px;scroll-snap-type:x mandatory}
.b-col{display:flex;flex-direction:column;scroll-snap-align:start}
.b-col h3{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.05em}
.b-list{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.champion{background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius);padding:18px;text-align:center;box-shadow:0 0 0 4px var(--accent-soft)}
.champion .cup{font-size:28px}
.champion .who{font-size:22px;font-weight:750;margin-top:6px}
.champion .who.ph{color:var(--faint);font-weight:600;font-size:15px}

/* Terrains */
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.court{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:86px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.court .cn{font-weight:750;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.court .cs{font-size:12px;color:var(--muted)}
.court .cm{font-weight:650;font-variant-numeric:tabular-nums}
.court.free{background:transparent;box-shadow:none;border-style:dashed}
.court.free .cn{color:var(--faint)}
.court.busy{border-left:4px solid var(--cc)}
.chip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--cs);color:var(--cc)}

/* Legend / footer */
.legend{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:12px;margin:28px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
footer{color:var(--faint);font-size:12px;padding:8px 0 40px}

/* Team dialog */
dialog{border:0;padding:0;border-radius:18px;width:min(520px,calc(100% - 24px));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,12,16,.45)}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.d-head h3{margin:0;font-size:18px}
.d-close{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:18px}
.d-body{padding:16px 18px 20px;max-height:70vh;overflow:auto}
.now{padding:12px 14px;border-radius:12px;background:var(--surface-2);margin-bottom:14px;font-size:14px}
.now b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{position:relative;padding:0 0 14px 22px}
.tl li::before{content:"";position:absolute;left:5px;top:6px;bottom:-6px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li::after{content:"";position:absolute;left:0;top:4px;width:12px;height:12px;border-radius:50%;background:var(--cc);box-shadow:0 0 0 3px var(--surface)}
.tl .l1{font-weight:650;font-size:14px}
.tl .l2{font-size:13px;color:var(--muted)}

/* Liste des équipes */
.btn{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn svg{width:18px;height:18px;color:var(--muted)}
dialog.wide{width:min(900px,calc(100% - 24px))}
.d-tools{padding:12px 18px;border-bottom:1px solid var(--line)}
.d-tools input{width:100%;height:40px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);padding:0 12px;font:inherit;outline:none}
.d-tools input:focus{border-color:var(--accent)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.tcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.tcard-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.tcard-h .num{min-width:34px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--surface-2);border:1px solid var(--line)}
.link{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12px;font-weight:600;padding:4px 0}
.players{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.players li{display:flex;gap:8px;align-items:baseline;font-size:13px}
.players .pn{font-weight:600}
.players .pc{color:var(--muted);font-size:12px;display:block}
.cat{flex:0 0 auto;font-size:11px;font-weight:700;width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.compo{margin-bottom:14px}
.compo h4,.tl-h{margin:0 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.count{color:var(--muted);font-size:13px;margin-bottom:10px}

@media (max-width:720px){
  .btn span{display:none}
  dialog.wide{width:calc(100% - 16px)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .search{width:100%}
  .top-row{gap:10px}
  .grid{grid-template-columns:1fr}
  .bracket{grid-auto-columns:85%}
  .brand h1{font-size:18px}
  .filters{width:100%;overflow-x:auto}
  .filters button{flex:1}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <h1 id="title">Concours</h1>
        <div class="sub" id="subtitle"></div>
      </div>
      <div class="live"><span class="dot"></span><span id="updated">Connexion…</span></div>
      <button class="btn" id="btnTeams" title="Liste des équipes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.8a3.3 3.3 0 0 1 0 6.4M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg><span>Liste des équipes</span></button>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" inputmode="numeric" placeholder="N° d'équipe…" aria-label="Rechercher une équipe">
        <button type="button" class="go" id="qgo" aria-label="Rechercher">Go</button>
      </label>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>

<main class="wrap">
  <section class="stats" id="stats"></section>
  <section id="view"></section>
  <div class="legend">
    <span><i style="background:var(--live)"></i>En cours sur un terrain</span>
    <span><i style="background:var(--accent)"></i>Vainqueur</span>
    <span><i style="border:1px dashed var(--faint)"></i>Place en attente</span>
    <span>Cliquer sur une équipe affiche son parcours</span>
  </div>
  <footer id="foot"></footer>
</main>

<dialog id="dlg">
  <div class="d-head"><h3 id="d-title"></h3><button class="d-close" onclick="dlg.close()" aria-label="Fermer">×</button></div>
  <div class="d-body" id="d-body"></div>
</dialog>

<dialog id="dlgTeams" class="wide">
  <div class="d-head"><h3>Liste des équipes</h3><button class="d-close" onclick="dlgTeams.close()" aria-label="Fermer">×</button></div>
  <div class="d-tools"><input id="tq" type="search" placeholder="Filtrer : n° d'équipe, nom de joueur ou club…" aria-label="Filtrer les équipes"></div>
  <div class="d-body" id="teams-body"></div>
</dialog>


<script>
/* ============ CONFIGURATION ============ */
const CONFIG = {
  dataFile: "donnees.js",   // fichier produit par surveillance.ps1, dans le même dossier que cette page
  refreshSeconds: 30,       // fréquence de relecture (version en ligne)
  staleMinutes: 3,          // avertit si le script de surveillance ne répond plus
  fileName: "",
  // Plus tard : noms des équipes { 1: "Dupont / Martin", ... }
  teamNames: {},
  showLicence: false        // true pour afficher les n° de licence dans la liste des équipes
};

/* ============ STRUCTURE DU FICHIER ============ */
const NONE = 9999;
const FINAL_PHASE_MAX_SLOTS = 8; // ¼, ½ et finale sont affichés en arbre
const CONCOURS = {
  A: { label: "Concours A", color: "A", rounds: [
      ["1toura","1er tour"],["2toura","2e tour"],["cadragea","Cadrage"],["1/64a","1/64 de finale"],
      ["1/32a","1/32 de finale"],["a16","1/16 de finale"],["a8","1/8 de finale"],["a4","1/4 de finale"],
      ["a2","1/2 finale"],["finalea","Finale"]],
      terrains: "attributionterrainsa", done: "jeuxterminesa" },
  B: { label: "Concours B", color: "B", rounds: [
      ["1tourb","1er tour"],["2tourb","2e tour"],["cadrageb","Cadrage"],["64emeb","1/64 de finale"],
      ["32emeb","1/32 de finale"],["16emeb","1/16 de finale"],["8emeb","1/8 de finale"],["1/4b","1/4 de finale"],
      ["1/2b","1/2 finale"],["finaleb","Finale"]],
      terrains: "attributionterrainsb", done: "jeuxterminesb" },
  C: { label: "Concours C", color: "C", rounds: [
      ["1tourc","1er tour"],["cadragec","Cadrage"],["32emec","1/32 de finale"],["16emec","1/16 de finale"],
      ["8emec","1/8 de finale"],["1/4c","1/4 de finale"],["1/2c","1/2 finale"],["finalec","Finale"]],
      terrains: "occupationterrainc", done: "jeuxterminesc" }
};

/* ============ LECTURE DU FICHIER ============ */
function parseAbc(text) {
  const sections = {};
  let cur = null;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    if (/[a-zA-Z]/.test(line)) {
      const [name, inline] = line.split(",");
      const key = name.toLowerCase().normalize("NFD").replace(/[^a-z0-9\/]/g, "");
      cur = sections[key] = { values: [], flag: inline !== undefined ? Number(inline) : null };
      continue;
    }
    if (!cur) continue;
    const parts = line.split(",").map(s => Number(s.trim()));
    cur.values.push(parts.length === 2 ? parts[1] : parts.length === 1 ? parts[0] : parts);
  }
  return sections;
}

const isTeam = v => v > 0 && v < 2000;
const isRef  = v => v >= 2000 && v < NONE;   // hypothèse : 20xx = vainqueur de la partie xx du tour précédent

function buildModel(S) {
  const model = { teams: S.equipenbre ? S.equipenbre.flag : 0, concours: {} };
  const tdispo = S["nbreterrainsdispo/debut/fin"];
  const tinfo = tdispo && Array.isArray(tdispo.values[0]) ? tdispo.values[0] : [38, 1, 38];
  model.courts = { count: tinfo[0], first: tinfo[1], last: tinfo[2],
                   busy: (S.occupationterrain ? S.occupationterrain.values : []) };

  for (const [id, def] of Object.entries(CONCOURS)) {
    const terr = S[def.terrains] ? S[def.terrains].values : [];
    const done = S[def.done] ? S[def.done].values : [];
    let slotOff = 0, matchOff = 0;
    const rounds = [];
    for (const [key, label] of def.rounds) {
      const sec = S[key];
      if (!sec) continue;
      const isFinal = /finale/.test(key) && !/\//.test(key);
      const slots = isFinal ? sec.values.slice(0, 2) : sec.values;
      const matches = [];
      for (let k = 0; k < slots.length / 2; k++) {
        const a = slots[2*k], b = slots[2*k+1];
        if (a === NONE && b === NONE) continue;
        const dA = done[slotOff + 2*k] === 1, dB = done[slotOff + 2*k + 1] === 1;
        const court = terr[matchOff + k] || 0;
        const m = { concours: id, round: label, roundKey: key, n: k + 1, a, b, court, winner: null, loser: null };
        if (a === NONE || b === NONE) {
          m.status = "exempt"; m.winner = a === NONE ? b : a;
        } else if (dA !== dB) {   // un seul perdant marqué ; si les deux sont marqués, la progression tranche (voir plus bas)
          m.status = "fini"; m.winner = dA ? b : a; m.loser = dA ? a : b;
        } else if (isTeam(a) && isTeam(b)) {
          m.status = court > 0 ? "encours" : "ajouer";
        } else {
          m.status = "attente";
        }
        matches.push(m);
      }
      const r = { key, label, matches, slots: slots.length, final: slots.length <= FINAL_PHASE_MAX_SLOTS };
      if (isFinal) r.champion = sec.values[2] || 0;
      if (matches.length) rounds.push(r);
      slotOff += sec.values.length - (isFinal ? 1 : 0);
      matchOff += slots.length / 2;
    }
    // Vainqueur déduit de la progression : l'équipe retrouvée dans un tour suivant du même concours
    // (ou désignée vainqueur de la finale) a gagné. Prioritaire sur les marques "jeux terminés",
    // qui ne sont pas toujours fiables en phase finale (les deux équipes y sont parfois marquées).
    rounds.forEach((r, i) => {
      for (const m of r.matches) {
        if (m.status === "exempt" || !isTeam(m.a) || !isTeam(m.b)) continue;
        let w = null;
        if (r.champion !== undefined) {
          if (r.champion === m.a || r.champion === m.b) w = r.champion;
        } else {
          for (const nr of rounds.slice(i + 1)) {
            const inA = nr.matches.some(x => x.a === m.a || x.b === m.a);
            const inB = nr.matches.some(x => x.a === m.b || x.b === m.b);
            if (inA !== inB) { w = inA ? m.a : m.b; break; }
            if (inA && inB) break;
          }
        }
        if (w !== null) { m.status = "fini"; m.winner = w; m.loser = w === m.a ? m.b : m.a; }
      }
      const real = r.matches.filter(m => m.status !== "exempt");
      r.status = real.every(m => m.status === "fini") && r.matches.every(m => isTeam(m.winner)) ? "fini"
        : r.matches.some(m => m.status === "encours" || m.status === "fini") ? "encours" : "avenir";
    });
    model.concours[id] = { id, ...def, rounds };
  }
  return model;
}

/* ============ AFFICHAGE ============ */
const $ = s => document.querySelector(s);
const state = { tab: "A", step: {}, filter: "all" };
let MODEL;

const teamName = n => CONFIG.teamNames[n] || `Équipe ${n}`;
const allMatches = () => Object.values(MODEL.concours).flatMap(c => c.rounds.flatMap(r => r.matches));

function teamRow(v, m) {
  if (isTeam(v)) {
    const cls = m && m.winner === v && m.status !== "exempt" ? "win" : m && m.loser === v ? "lose" : "";
    const res = cls === "win" ? `<span class="res">Gagné</span>` : "";
    return `<button class="row ${cls}" data-team="${v}"><span class="num">${v}</span><span class="name">${teamName(v)}</span>${res}</button>`;
  }
  const label = isRef(v) ? `Vainqueur partie ${v - 2000}` : "En attente";
  return `<div class="row ph"><span class="num">?</span><span class="name">${label}</span></div>`;
}

function statusBadge(m) {
  switch (m.status) {
    case "encours": return m.court === NONE ? `<span class="badge wait">En attente</span>` : `<span class="badge live">Terrain ${m.court}</span>`;
    case "fini": return `<span class="badge done">Terminée</span>`;
    case "exempt": return `<span class="badge">Exempt</span>`;
    case "ajouer": return `<span class="badge">À jouer</span>`;
    default: return `<span class="badge">En attente</span>`;
  }
}

function matchCard(m) {
  let body;
  if (m.status === "exempt") {
    body = teamRow(m.winner, null) + `<div class="m-head"><span>Qualifiée directement</span></div>`;
  } else {
    body = teamRow(m.a, m) + teamRow(m.b, m);
  }
  return `<article class="match ${m.status}"><div class="m-head"><b>Partie ${m.n}</b>${statusBadge(m)}</div>${body}</article>`;
}

function renderTabs() {
  const tabs = Object.values(MODEL.concours).map(c => {
    const n = new Set(c.rounds[0] ? c.rounds[0].matches.flatMap(m => [m.a, m.b]).filter(isTeam) : []).size;
    return `<button class="tab" role="tab" data-tab="${c.id}" aria-selected="${state.tab === c.id}" style="--c:var(--${c.color})"><span class="sw"></span>${c.label}<span class="n">${n} éq.</span></button>`;
  });
  tabs.push(`<button class="tab" role="tab" data-tab="T" aria-selected="${state.tab === "T"}" style="--c:var(--live)"><span class="sw"></span>Terrains</button>`);
  $("#tabs").innerHTML = tabs.join("");
}

function renderStats() {
  const ms = allMatches().filter(m => m.status !== "exempt");
  const fini = ms.filter(m => m.status === "fini").length;
  const enc = ms.filter(m => m.status === "encours").length;
  const busy = MODEL.courts.busy.filter(v => v === 1).length;
  const total = ms.filter(m => isTeam(m.a) && isTeam(m.b)).length;
  $("#stats").innerHTML = `
    <div class="stat"><div class="k">Équipes engagées</div><div class="v">${MODEL.teams}</div></div>
    <div class="stat"><div class="k">Parties en cours</div><div class="v">${enc}</div></div>
    <div class="stat"><div class="k">Parties terminées</div><div class="v">${fini}<small> / ${total}</small></div><div class="bar"><i style="width:${total ? fini/total*100 : 0}%"></i></div></div>
    <div class="stat"><div class="k">Terrains occupés</div><div class="v">${busy}<small> / ${MODEL.courts.count}</small></div><div class="bar"><i style="width:${busy/MODEL.courts.count*100}%"></i></div></div>`;
}

function defaultStep(c) {
  const pre = c.rounds.filter(r => !r.final);
  const cur = pre.find(r => r.status === "encours") || pre.find(r => r.status === "avenir");
  return cur ? cur.key : "final";
}

function renderConcours(c) {
  document.documentElement.style.setProperty("--accent", `var(--${c.color})`);
  document.documentElement.style.setProperty("--accent-soft", `var(--${c.color}-soft)`);
  const step = state.step[c.id] || (state.step[c.id] = defaultStep(c));
  const pre = c.rounds.filter(r => !r.final);
  const fin = c.rounds.filter(r => r.final);
  const finStatus = fin.some(r => r.status === "encours") ? "encours" : fin.length && fin.every(r => r.status === "fini") ? "fini" : "avenir";
  const stTxt = { fini: "Terminé", encours: "En cours", avenir: "À venir" };

  const chips = pre.map(r => {
    const real = r.matches.filter(m => m.status !== "exempt");
    const f = real.filter(m => m.status === "fini").length;
    return `<button class="step ${r.status}" data-step="${r.key}" aria-selected="${step === r.key}"><div class="t"><span class="st"></span>${r.label}</div><div class="s">${f}/${real.length} parties · ${stTxt[r.status]}</div></button>`;
  });
  if (fin.length) chips.push(`<button class="step ${finStatus}" data-step="final" aria-selected="${step === "final"}"><div class="t"><span class="st"></span>Phase finale</div><div class="s">${fin.map(r => r.label.replace(" de finale","").replace(" finale","")).join(" · ")}</div></button>`);

  let content;
  if (step === "final") {
    const cols = fin.map(r => `<div class="b-col"><h3>${r.label}</h3><div class="b-list">${r.matches.map(matchCard).join("")}</div></div>`);
    const champ = fin.length ? fin[fin.length - 1].champion : 0;
    cols.push(`<div class="b-col"><h3>Vainqueur</h3><div class="b-list"><div class="champion"><div class="cup">🏆</div>${isTeam(champ) ? `<div class="who">${teamName(champ)}</div>` : `<div class="who ph">À déterminer</div>`}</div></div></div>`);
    content = `<div class="bracket">${cols.join("")}</div>`;
  } else {
    const r = c.rounds.find(x => x.key === step);
    const counts = { all: r.matches.length };
    // En cours = partie non terminée avec un terrain ; En attente = les 2 équipes connues, pas encore de terrain
    const FILTRES = {
      encours: m => m.status === "encours" && m.court !== NONE,
      attente: m => (m.status === "encours" && m.court === NONE) || m.status === "ajouer",
      fini: m => m.status === "fini"
    };
    if (state.filter !== "all" && !FILTRES[state.filter]) state.filter = "all";
    Object.keys(FILTRES).forEach(s => counts[s] = r.matches.filter(FILTRES[s]).length);
    const list = r.matches.filter(m => state.filter === "all" || FILTRES[state.filter](m));
    const fl = [["all","Toutes"],["encours","En cours"],["attente","En attente"],["fini","Terminées"]]
      .map(([k, l]) => `<button data-filter="${k}" aria-pressed="${state.filter === k}">${l}<span class="c">${counts[k]}</span></button>`).join("");
    content = `<div class="sec-head"><div><h2 style="font-size:16px">${r.label}</h2><p>${r.matches.length} parties</p></div><div class="filters">${fl}</div></div>
      ${list.length ? `<div class="grid">${list.map(matchCard).join("")}</div>` : `<div class="empty">Aucune partie dans cette catégorie.</div>`}`;
  }

  $("#view").innerHTML = `
    <div class="sec-head"><div><h2><span class="sw"></span>${c.label}</h2><p>${c.id === "A" ? "Concours principal" : c.id === "B" ? "Perdants du 1er tour A et récupération du 2e tour A" : "Perdants du 1er tour B"}</p></div></div>
    <div class="steps">${chips.join("")}</div>
    ${content}`;
}

function renderCourts() {
  document.documentElement.style.setProperty("--accent", "var(--live)");
  document.documentElement.style.setProperty("--accent-soft", "var(--live-soft)");
  const byCourt = {};
  allMatches().filter(m => m.status === "encours").forEach(m => byCourt[m.court] = m);
  const tiles = [];
  for (let t = MODEL.courts.first; t <= MODEL.courts.last; t++) {
    const m = byCourt[t], busy = MODEL.courts.busy[t - 1] === 1 || m;
    if (m) {
      const c = CONCOURS[m.concours];
      tiles.push(`<div class="court busy" style="--cc:var(--${c.color});--cs:var(--${c.color}-soft)"><div class="cn">T ${t}<span class="chip">${m.concours}</span></div><div class="cm">${m.a} vs ${m.b}</div><div class="cs">${m.round} · partie ${m.n}</div></div>`);
    } else if (busy) {
      tiles.push(`<div class="court busy" style="--cc:var(--faint);--cs:var(--surface-2)"><div class="cn">T ${t}</div><div class="cs">Occupé</div></div>`);
    } else {
      tiles.push(`<div class="court free"><div class="cn">T ${t}</div><div class="cs">Libre</div></div>`);
    }
  }
  const nb = Object.keys(byCourt).length;
  $("#view").innerHTML = `<div class="sec-head"><div><h2><span class="sw"></span>Terrains</h2><p>${nb} occupés · ${MODEL.courts.count - nb} libres</p></div></div><div class="courts">${tiles.join("")}</div>`;
}

function render() {
  renderTabs(); renderStats();
  state.tab === "T" ? renderCourts() : renderConcours(MODEL.concours[state.tab]);
}

/* ============ COMPOSITION DES ÉQUIPES (fichier .Gnle) ============ */
// Bloc " n " puis une ligne par joueur : type,dép,licence,NOM Prénom,code/club,catégorie — puis une ligne "M,..."
let TEAMS = {};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function parseTeams(text) {
  const teams = {}; let cur = null;
  for (const raw of (text || "").split(/\r?\n/)) {
    const line = raw.trim();
    if (/^\d+$/.test(line)) { cur = teams[+line] = []; continue; }
    if (!cur) continue;
    const f = line.split(",");
    if (f.length >= 6 && f[3]) {
      const club = f[4] || "";
      cur.push({ name: f[3].trim(), licence: f[2].trim(), club: club.includes("/") ? club.split("/").slice(1).join("/").trim() : club.trim(), cat: (f[5] || "").trim() });
    }
  }
  return teams;
}

function playersHtml(n) {
  const pl = TEAMS[n] || [];
  if (!pl.length) return `<div class="count">Composition non disponible.</div>`;
  return `<ul class="players">${pl.map(p => `<li><span class="cat" title="Catégorie">${esc(p.cat || "–")}</span><span><span class="pn">${esc(p.name)}</span>${CONFIG.showLicence ? ` <span class="pc" style="display:inline">· ${esc(p.licence)}</span>` : ""}<span class="pc">${esc(p.club)}</span></span></li>`).join("")}</ul>`;
}

function renderTeamList() {
  const q = $("#tq").value.trim().toLowerCase();
  const nums = Object.keys(TEAMS).map(Number).sort((a, b) => a - b);
  const list = nums.filter(n => !q || String(n) === q ||
    (!/^\d+$/.test(q) && TEAMS[n].some(p => (p.name + " " + p.club).toLowerCase().includes(q))));
  $("#teams-body").innerHTML = !nums.length
    ? `<div class="empty">La composition des équipes n'est pas disponible (fichier .Gnle introuvable).</div>`
    : `<div class="count">${list.length} équipe${list.length > 1 ? "s" : ""}${q ? " trouvée" + (list.length > 1 ? "s" : "") : ""}</div>
       <div class="teams">${list.map(n => `<div class="tcard"><div class="tcard-h"><span class="num">${n}</span><button class="link" data-team="${n}">Voir le parcours →</button></div>${playersHtml(n)}</div>`).join("")}</div>`;
}

function openTeamList() {
  renderTeamList();
  if (!$("#dlgTeams").open) $("#dlgTeams").showModal();
  $("#tq").focus();
}

/* ============ PARCOURS D'UNE ÉQUIPE ============ */
function showTeam(n) {
  if (!isTeam(n) || n > MODEL.teams) return;
  const items = allMatches().filter(m => m.a === n || m.b === n);
  const line = m => {
    const opp = m.a === n ? m.b : m.a;
    const oppTxt = isTeam(opp) ? `n° ${opp}` : isRef(opp) ? `le vainqueur de la partie ${opp - 2000}` : "adversaire à venir";
    switch (m.status) {
      case "fini": return m.winner === n ? `Gagné contre ${oppTxt}` : `Perdu contre ${oppTxt}`;
      case "encours": return m.court === NONE ? `En attente contre ${oppTxt}` : `En cours contre ${oppTxt} · terrain ${m.court}`;
      case "ajouer": return `À jouer contre ${oppTxt}`;
      case "exempt": return `Exempt, qualifiée directement`;
      default: return `En attente contre ${oppTxt}`;
    }
  };
  const last = items[items.length - 1];
  if ($("#dlgTeams").open) $("#dlgTeams").close();
  $("#d-title").textContent = teamName(n);
  $("#d-body").innerHTML = (last ? `<div class="now"><b>Situation actuelle</b>${CONCOURS[last.concours].label} · ${last.round} — ${line(last)}</div>` : "") +
    (TEAMS[n] ? `<div class="compo"><h4>Composition</h4>${playersHtml(n)}</div><h4 class="tl-h">Parcours</h4>` : "") +
    `<ul class="tl">${items.map(m => `<li style="--cc:var(--${CONCOURS[m.concours].color})"><div class="l1">${CONCOURS[m.concours].label} · ${m.round} · partie ${m.n}</div><div class="l2">${line(m)}</div></li>`).join("")}</ul>`;
  if (!$("#dlg").open) $("#dlg").showModal();
}

/* ============ ÉVÉNEMENTS ============ */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]"); if (t) { state.tab = t.dataset.tab; state.filter = "all"; render(); return; }
  const s = e.target.closest("[data-step]"); if (s) { state.step[state.tab] = s.dataset.step; state.filter = "all"; render(); return; }
  const f = e.target.closest("[data-filter]"); if (f) { state.filter = f.dataset.filter; render(); return; }
  const tm = e.target.closest("[data-team]"); if (tm) showTeam(Number(tm.dataset.team));
});
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); const v = Number(e.target.value); setTimeout(() => showTeam(v), 0); } });
$("#qgo").addEventListener("click", e => { e.preventDefault(); const v = Number($("#q").value); $("#q").blur(); setTimeout(() => showTeam(v), 0); });
$("#dlg").addEventListener("click", e => { if (e.target.id === "dlg") e.target.close(); });
$("#dlgTeams").addEventListener("click", e => { if (e.target.id === "dlgTeams") e.target.close(); });
$("#btnTeams").addEventListener("click", openTeamList);
$("#tq").addEventListener("input", renderTeamList);

/* ============ DÉMARRAGE ============ */
function headerFromFileName(fn) {
  const m = fn.match(/^(\d{4})(\d{2})(\d{2})_(.+?)_(\d+)\.abc$/i);
  if (!m) return { title: fn, sub: "" };
  const date = new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const parts = m[4].split("_");
  const type = parts[parts.length - 1].replace(/([a-z])([A-Z])/g, "$1 $2").replace(/([A-Z])([A-Z][a-z])/g, "$1 $2");
  return { title: `Concours ${type}`, sub: `${date.charAt(0).toUpperCase() + date.slice(1)} · ${parts.slice(0, -1).join(" ")}` };
}

function load(text) {
  MODEL = buildModel(parseAbc(text));
  // Fichier contenant une ligne "MESSAGE, ..." : la page affiche seulement ce message
  const msg = (text || "").match(/^\s*MESSAGE\s*,(.*)$/mi);
  ["#tabs", "#stats", ".legend"].forEach(s => { $(s).style.display = msg ? "none" : ""; });
  if (msg) {
    $("#title").textContent = document.title = "Résultats en direct";
    $("#subtitle").textContent = ""; $("#foot").textContent = "";
    $("#view").innerHTML = `<div class="message"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><p>${esc(msg[1].trim())}</p></div>`;
    return;
  }
  const h = headerFromFileName(CONFIG.fileName);
  $("#title").textContent = h.title; document.title = h.title;
  $("#subtitle").textContent = h.sub;
  $("#foot").textContent = `Source : ${CONFIG.fileName} · ${MODEL.teams} équipes · ${MODEL.courts.count} terrains`;
  render();
}

/* ============ LECTURE AUTOMATIQUE ============ */
// surveillance.ps1 écrit donnees.js : window.ABC_DATA = { fileName, modified, heartbeat, text, teams }
// Un <script> est rechargé régulièrement : cela fonctionne en ouvrant la page par double-clic (file://).
let lastSignature = null;

function setLive(ok, msg) {
  const dot = document.querySelector(".live .dot");
  dot.style.background = ok ? "" : "var(--B)";
  dot.style.animation = ok ? "" : "none";
  $("#updated").textContent = msg;
}

function showWaiting(msg) {
  if (MODEL) return;
  $("#view").innerHTML = `<div class="empty">${msg}</div>`;
}

function poll() {
  const s = document.createElement("script");
  s.src = CONFIG.dataFile + "?t=" + Date.now();
  s.onload = () => {
    s.remove();
    const d = window.ABC_DATA;
    if (!d || !d.text) { setLive(false, "Aucun fichier .abc trouvé"); showWaiting("Aucun fichier .abc trouvé dans le dossier surveillé."); return; }
    const sig = d.fileName + "|" + d.modified + "|" + d.text.length + "|" + (d.teams || "").length;
    if (sig !== lastSignature) {
      lastSignature = sig;
      CONFIG.fileName = d.fileName;
      const dlgOpen = $("#dlg").open ? $("#d-title").textContent : null;
      TEAMS = parseTeams(d.teams);
      if ($("#dlgTeams").open) renderTeamList();
      try { load(d.text); } catch (e) { console.error(e); setLive(false, "Fichier illisible"); return; }
      if (dlgOpen) { const n = Number(dlgOpen.replace(/\D/g, "")); if (n) showTeam(n); }
    }
    const mod = new Date(d.modified);
    const stale = d.heartbeat && (Date.now() - new Date(d.heartbeat)) > CONFIG.staleMinutes * 60000;
    if (stale) setLive(false, "Surveillance arrêtée ? Relancez demarrer.bat");
    else setLive(true, "Mis à jour à " + mod.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }));
  };
  s.onerror = () => {
    s.remove();
    setLive(false, "Résultats pas encore disponibles");
    showWaiting("Les résultats seront affichés ici dès le début du concours.");
  };
  document.head.appendChild(s);
}

poll();
setInterval(poll, CONFIG.refreshSeconds * 1000);
</script>
